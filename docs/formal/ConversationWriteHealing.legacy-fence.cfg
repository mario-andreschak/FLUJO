\* expect: violation
\* Before #1329: a failed write fenced the chat and the fence refused every new write.
CONSTANTS
  Proc = {p1}
  Conv = {c1}
  Slots = 1
  MaxFaults = 1
  MaxCrashes = 1
  MaxCaptures = 0
  Legacy = {"fenceRefusesWrites"}
  NoOwner = NoOwner

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  SlotsBounded
  OneWriterPerConversation
  WriteHoldsIntent
  CaptureExcludesWrites
  QuarantineOnlyWhileOwned

PROPERTIES
  FencesHeal
