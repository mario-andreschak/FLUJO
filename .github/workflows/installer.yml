# Validates the side-effect-free Windows installer decisions and builds the
# graphical bootstrapper for release preflight and explicit manual runs.
name: Validate Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      clean_windows:
        description: Run the compiled installer and first launch on a fresh Windows worker
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  artifact-smoke:
    if: ${{ !inputs.clean_windows }}
    name: MCP artifact validation (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - name: Install production build dependencies
        run: npm ci --include=dev

      - name: Build production artifacts
        run: npm run build

      # Separate native commands so a later success cannot mask an earlier
      # nonzero exit code in PowerShell.
      - name: Verify browser installer helpers
        run: node --test mcp-servers/browser/scripts/install-browser.test.mjs

      - name: Exercise MCP process boundaries
        run: npm run test:mcp-process-boundary

      - name: Validate MCP release artifacts
        run: npm run validate:mcp-release

      - name: Verify the packaged Antigravity CLI
        run: node --test scripts/antigravity-cli-artifact.test.mjs

      # A clean consumer install is intentionally expensive on hosted Windows.
      # Keep it as a release/manual gate instead of paying that cost on every
      # pull request and push to main.
      - name: Exercise packed consumer artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          npm run smoke:mcp-artifacts

  powershell-tests:
    if: ${{ !inputs.clean_windows }}
    name: Installer decisions (Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Pester
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run installer tests
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path tests\installer.Tests.ps1 -CI

      - name: Exercise native diagnostics with the wizard PowerShell runtime
        shell: pwsh
        run: ./tests/installer-native.test.ps1

  installer-build:
    name: Compile flujo-setup.exe
    needs: [powershell-tests, artifact-smoke, unix-installer-tests]
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.installer-artifact.outputs.artifact-id }}
      sha256: ${{ steps.installer-digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - name: Install pinned Inno Setup
        shell: powershell
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey could not install Inno Setup 6.7.1 (exit $LASTEXITCODE)."
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Pinned Inno Setup compiler was not found: $iscc"
          }

      - name: Compile and validate the installer
        shell: powershell
        run: |
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $expectedTag = "v$packageVersion"
            if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'."
            }
            $version = $packageVersion
            $sourceRef = $expectedTag
            $sourceRevision = $env:GITHUB_SHA
          } else {
            $version = '0.0.0'
            $sourceRef = $env:GITHUB_REF_NAME
            $sourceRevision = $env:GITHUB_SHA
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "/DMyBranch=$sourceRef" "/DMyRevision=$sourceRevision" installer\flujo-setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed (exit $LASTEXITCODE)."
          }

          $artifact = Join-Path $PWD 'installer\Output\flujo-setup.exe'
          if (-not (Test-Path -LiteralPath $artifact)) {
            throw "Expected installer was not produced: $artifact"
          }
          if ((Get-Item -LiteralPath $artifact).Length -le 0) {
            throw "Installer artifact is empty: $artifact"
          }

      - name: Bind release installer bytes to the exact source tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/installer-release.mjs prepare

      - name: Retain the original executable digest
        id: installer-digest
        run: node scripts/installer-release.mjs digest

      - name: Upload validation artifact
        id: installer-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flujo-setup
          path: |
            installer/Output/flujo-setup.exe
            installer/Output/installer-release-evidence.json
            installer/Output/installer-SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  installer-attest:
    if: ${{ github.repository == 'mario-andreschak/FLUJO' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [installer-build, installer-acceptance]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      INSTALLER_RELEASE_DIR: installer/Output
      EXPECTED_INSTALLER_SHA256: ${{ needs.installer-build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.installer-build.outputs.artifact_id }}
          path: ${{ env.INSTALLER_RELEASE_DIR }}
          merge-multiple: true
      - name: Recheck exact main verification before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-release-verification.mjs installer
      - name: Verify original installer bytes and source inventory
        run: node scripts/installer-release.mjs validate
      - name: Attest original executable and source evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ env.INSTALLER_RELEASE_DIR }}/installer-SHA256SUMS

  installer-publish:
    if: ${{ github.repository == 'mario-andreschak/FLUJO' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [installer-build, installer-attest]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      INSTALLER_RELEASE_DIR: installer/Output
      EXPECTED_INSTALLER_SHA256: ${{ needs.installer-build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.installer-build.outputs.artifact_id }}
          path: ${{ env.INSTALLER_RELEASE_DIR }}
          merge-multiple: true
      - name: Verify official signatures for the original installer and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/installer-release.mjs verify-signatures
      - name: Recheck exact main verification before attaching release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-release-verification.mjs installer

      - name: Attach installer to version release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ env.INSTALLER_RELEASE_DIR }}/flujo-setup.exe
            ${{ env.INSTALLER_RELEASE_DIR }}/installer-release-evidence.json
            ${{ env.INSTALLER_RELEASE_DIR }}/installer-SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true

  installer-acceptance:
    name: Install and launch original installer bytes
    needs: installer-build
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      EXPECTED_INSTALLER_SHA256: ${{ needs.installer-build.outputs.sha256 }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.installer-build.outputs.artifact_id }}
          path: installer/Output
          merge-multiple: true
      - name: Prepare real App Installer
        shell: pwsh
        run: ./scripts/prepare-windows-installer-runner.ps1
      - name: Install, rerun and launch the original executable
        shell: pwsh
        run: ./scripts/verify-windows-install.ps1
      - name: Retain release installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release-installation
          path: ${{ runner.temp }}/flujo-install-evidence/**
          if-no-files-found: error
          retention-days: 30

  unix-installer-tests:
    if: ${{ !inputs.clean_windows }}
    name: Unix installer validation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - name: Run Unix installer Node.js version tests
        run: |
          chmod +x scripts/install.sh
          bash tests/installer-unix.test.sh

      - name: Verify package.json engine contract
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { readFileSync } from 'node:fs';
            import { SUPPORTED_NODE_RANGE } from './bin/node-runtime.mjs';
            for (const directory of ['', 'mcp-servers/bash/', 'mcp-servers/browser/', 'mcp-servers/filesystem/', 'mcp-servers/flujo/', 'mcp-servers/shared/']) {
              assert.equal(JSON.parse(readFileSync(directory + 'package.json', 'utf8')).engines.node, SUPPORTED_NODE_RANGE, directory);
            }
            console.log('All six engine declarations match the canonical runtime policy.');
          "

  clean-windows:
    if: ${{ inputs.clean_windows }}
    name: Fresh Windows installer and first launch
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - name: Provision App Installer on the hosted Windows Server image
        shell: pwsh
        run: ./scripts/prepare-windows-installer-runner.ps1
      - name: Reproduce the released failure and verify native command handling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/mario-andreschak/FLUJO/320347356891aa1c24e0f2f9ce12719317e58bde/scripts/install.ps1' -OutFile .tmp/released-install.ps1
          ./tests/installer-native.test.ps1 -InstallScript .tmp/released-install.ps1 -WorkDirectory .tmp/native-released -ExpectLegacyFailure
          ./tests/installer-native.test.ps1 -WorkDirectory .tmp/native-fixed
      - name: Run installer decision regressions under Windows PowerShell
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path tests/installer.Tests.ps1 -CI
      - name: Compile the exact candidate installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup is missing from the runner.' }
          & $iscc "/DMyAppVersion=0.0.0" "/DMyBranch=$env:GITHUB_REF_NAME" "/DMyRevision=$env:GITHUB_SHA" installer/flujo-setup.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed.' }
      - name: Install into an empty folder and launch the installed application
        shell: pwsh
        run: ./scripts/verify-windows-install.ps1
      - name: Retain installer, diagnostics and first-launch evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-first-install
          path: |
            installer/Output/flujo-setup.exe
            ${{ runner.temp }}/flujo-install-evidence/**
            .tmp/native-*/*.log
            .tmp/native-*/*.error
          if-no-files-found: error
          retention-days: 14
