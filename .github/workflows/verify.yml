# One critical-path hosted check after broad local qualification.
name: verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verification:
    name: verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 24.21.0 --record
      - run: npm ci --include=dev
      - name: Verify workflow and release contracts
        run: node --test scripts/verification-contract.test.mjs scripts/workflow-contract.test.mjs scripts/required-check-workflow.test.mjs scripts/verify-repository-rules.test.mjs scripts/verify-ci-node.test.mjs scripts/node-runtime.test.mjs scripts/scanner-workflow-contract.test.mjs scripts/probe-filesystem-identity.test.mjs scripts/selector-parser-security.test.mjs scripts/require-release-verification.test.mjs scripts/release-verification.test.mjs scripts/verify-codex-built-import.test.mjs
      - name: Build once with the default heap
        run: npm run build
      - run: npm run typecheck:mcp
      - run: npm run validate:mcp-release
      - name: Critical API, MCP and transfer regressions
        run: node scripts/run-local-jest.cjs --ci --selectProjects node --runInBand --runTestsByPath __tests__/settings/backupRestoreRoutes.test.ts __tests__/settings/backupStrictStorage.test.ts __tests__/workspace/workspaceListRoute.test.ts __tests__/workspace/workspaceCreateMcpRecords.test.ts __tests__/workspace/workspaceRouteWrapper.test.ts __tests__/flow/conversationLogReadAdmission.test.ts __tests__/flow/conversationSnapshotAdmission.test.ts __tests__/flow/modelTurnArchiveWriteBudget.test.ts __tests__/mcp/toolDiscoveryPagination.test.ts __tests__/mcp/storedTransportAdmission.test.ts __tests__/mcp/tasksGenerationsProtocol.test.ts __tests__/mcp/clientTasksLifecycle.test.ts __tests__/mcp/tasksExtensionSession.test.ts __tests__/mcp/serverTasks.test.ts __tests__/mcp/flowsTasksServer.test.ts __tests__/mcp/flowsTasksRouteClassification.test.ts __tests__/mcp/protectedPackageRunner.test.ts __tests__/model/orcarouterProvider.test.ts __tests__/ollama/ollamaClient.test.ts __tests__/ollama/pullRoute.test.ts __tests__/packages/workspaceMcpPreparationMarker.test.ts __tests__/security/ownerAccess.test.ts __tests__/security/isolatedMcp.test.ts __tests__/mcp/isolatedMcpTransport.test.ts __tests__/mcp/securityReviewSource.test.ts __tests__/mcp/securityReviewReport.test.ts __tests__/mcp/securityReviewRoute.test.ts __tests__/mcp/securityReviewLifecycle.test.ts __tests__/mcp/securityReviewRunner.test.ts __tests__/mcp/modelRiskEvidence.test.ts __tests__/mcp/modelRiskAssessment.test.ts __tests__/mcp/modelRiskAssessmentRoute.test.ts __tests__/model/readOnlyAssessmentAdapter.test.ts __tests__/mcp/discoverySearch.test.ts __tests__/mcp/registryDiscovery.test.ts __tests__/mcp/assistedPreferences.test.ts __tests__/mcp/assistedRanking.test.ts __tests__/mcp/assistedInstall.test.ts __tests__/mcp/assistantRoute.test.ts __tests__/mcp/registryInstall.test.ts __tests__/mcp/registryIconsRoute.test.ts __tests__/mcp/registryDiscoveryClient.test.ts __tests__/mcp/registryDiscoveryRoute.test.ts __tests__/mcp/quality/orchestrator.test.ts __tests__/mcp/installBestAssistedTool.test.ts __tests__/mcp/assistedDiscoveryBody.test.ts
      - name: Critical model setup regressions
        run: node scripts/run-local-jest.cjs --ci --selectProjects jsdom --runInBand --runTestsByPath __tests__/frontend/components/ChatHistory.test.tsx __tests__/frontend/components/PersonaGoalCard.test.tsx __tests__/frontend/components/PersonaGoalValidation.test.tsx __tests__/frontend/components/BackupSettings.test.tsx __tests__/frontend/components/ModelConnectionWizard.test.tsx __tests__/frontend/components/McpConnectionWizard.test.tsx __tests__/frontend/components/McpAiConnectionPanel.test.tsx __tests__/frontend/components/McpServerManagerWizardOwnership.test.tsx __tests__/frontend/components/oauthPopup.test.ts __tests__/frontend/components/CardPickerGrid.test.tsx __tests__/frontend/components/PersonaCreationWizard.test.tsx __tests__/frontend/components/RoleVersionCardLocalization.test.tsx __tests__/frontend/components/McpSecurityReviewPanel.test.tsx __tests__/frontend/components/McpModelRiskAssessmentPanel.test.tsx __tests__/frontend/components/ServerModalDiscoverySession.test.tsx __tests__/frontend/components/MarketplaceTab.test.tsx
      - name: Retain exact runtime measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-runtime
          path: ci-node-runtime/
          if-no-files-found: error
