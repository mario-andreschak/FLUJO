name: Publish Docker Image

# Builds the official FLUJO image and pushes it to GHCR as
# ghcr.io/mario-andreschak/flujo (issue #57). Consumers like the brain stack
# reference :latest. The workflow is dispatched explicitly by `npm run release`
# or `npm run dockerbuild`; builds from main also get the package.json version
# and a commit-sha tag for pinning.
#
# NOTE: the first published package is PRIVATE by default. Make it public once
# under https://github.com/users/mario-andreschak/packages/container/flujo/settings
# or anonymous `docker pull` keeps failing with "denied".

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact npm release commit
        type: string
        required: false
      expected_version:
        description: Optional exact npm release version
        type: string
        required: false

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Require exact-commit main verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.expected_sha }}
          RELEASE_VERSION: ${{ inputs.expected_version }}
        run: node scripts/require-release-verification.mjs image

      - name: Build and validate synchronized MCP release artifacts
        run: |
          npm ci --include=dev
          npm run build
          npm run test:mcp-process-boundary
          npm run validate:mcp-release
          npm run smoke:mcp-artifacts

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Read package.json version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build local image for process-boundary smoke
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: flujo-process-boundary-smoke:${{ github.sha }}
          build-args: |
            FLUJO_APPLICATION_VERSION=${{ steps.version.outputs.version }}
            FLUJO_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha

      - name: Exercise MCP proxy in the local image
        shell: bash
        run: |
          set -euo pipefail
          volume="flujo-smoke-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="flujo-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d --name "$container" \
            -p 127.0.0.1:4200:4200 \
            -v "$volume:/app/data" \
            "flujo-process-boundary-smoke:${{ github.sha }}"
          node scripts/smoke-mcp-artifacts.mjs --proxy-only http://127.0.0.1:4200

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # Registry paths must be lowercase; the repo name (FLUJO) is not.
          images: ghcr.io/mario-andreschak/flujo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLUJO_APPLICATION_VERSION=${{ steps.version.outputs.version }}
            FLUJO_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
