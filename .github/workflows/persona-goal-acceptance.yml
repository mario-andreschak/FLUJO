name: persona-goal-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persona-goal-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-integration:
    name: offline goal lifecycle (scripted model, real tools)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build:mcp
      - name: Verify fixture and independent evidence checks
        run: node --test scripts/persona-goal-acceptance/fixture.test.mjs scripts/persona-goal-acceptance/evidence.test.mjs scripts/persona-goal-acceptance/terminal-fixture.test.mjs
      - name: Exercise automatic continuation and recovery
        run: node scripts/run-persona-goal-acceptance.mjs --mode=offline --timeout-seconds=600
      - name: Preserve goal lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: persona-goal-offline-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: goal-acceptance-artifacts/
          if-no-files-found: warn
