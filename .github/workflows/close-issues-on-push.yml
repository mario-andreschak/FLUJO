name: Mark Issues Live on Push

on:
  push:
    branches: [main]

jobs:
  mark-live:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Mark referenced pushed issues live
        uses: actions/github-script@v7
        with:
          script: |
            const PRE_LIVE = new Set([
              'status: IN WORK',
              'status: TESTING',
              'status: LOCAL COMMIT',
            ]);
            const LIVE = 'status: LIVE';

            // Collect issue numbers from the heading (first line) of each pushed commit.
            const nums = new Set();
            for (const c of context.payload.commits || []) {
              const heading = (c.message || '').split('\n')[0];
              for (const m of heading.matchAll(/#(\d+)/g)) {
                nums.add(Number(m[1]));
              }
            }

            if (nums.size === 0) {
              core.info('No #N references in pushed commit headings; nothing to do.');
              return;
            }
            core.info(`Referenced numbers: ${[...nums].join(', ')}`);

            for (const number of nums) {
              let issue;
              try {
                const res = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                });
                issue = res.data;
              } catch (e) {
                core.info(`#${number}: not found (${e.status}); skipping.`);
                continue;
              }

              // Skip pull requests — #N is shared between issues and PRs.
              if (issue.pull_request) {
                core.info(`#${number}: is a PR; skipping.`);
                continue;
              }
              const labels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
              const staleStatuses = labels.filter(label => PRE_LIVE.has(label));
              if (staleStatuses.length === 0) {
                core.info(`#${number}: no pre-live status label; leaving untouched.`);
                continue;
              }

              if (!labels.includes(LIVE)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  labels: [LIVE],
                });
              }
              for (const name of staleStatuses) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  name,
                });
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`#${number}: marked LIVE and closed.`);
            }
