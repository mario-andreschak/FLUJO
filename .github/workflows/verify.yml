# Pull-request verification (issue #457).
#
# Before this workflow existed no CI job ran `npm test`, `tsc --noEmit` or
# `eslint` on a pull request: two test files that could not even be parsed were
# merged to main and stayed broken. These jobs are the gate that makes a
# non-executing test file impossible to miss.
#
# Required contexts and administrator acceptance are documented in
# docs/engineering-verification.md. YAML alone does not protect main.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      persona_memory_profile:
        description: Also capture a diagnostic allocation profile of the full Persona soak
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-build:
    name: Production build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Retain the original ordinary default-heap build; installed checks use supported runtimes below.
          node-version: '22.13.1'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.13.1 --historical-build --record
      - run: npm ci --include=dev
      - name: Verify tracing against a populated runtime directory
        run: node --test scripts/exclude-workspaces-from-next-glob.test.mjs
      - name: Build with the ordinary command and default Node heap
        run: npm run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.0'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.17.0 --record
      - name: Qualify installed app and packed MCP packages on Node 22.17.0
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm run build
          npm run typecheck:mcp
          npm run validate:mcp-release
          npm run smoke:mcp-artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - name: Qualify installed app and packed MCP packages on Node 22.23.3
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm run build
          npm run typecheck:mcp
          npm run validate:mcp-release
          npm run smoke:mcp-artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.2.0'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 24.2.0 --record
      - name: Qualify installed app and packed MCP packages on Node 24.2.0
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm run build
          npm run typecheck:mcp
          npm run validate:mcp-release
          npm run smoke:mcp-artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 24.21.0 --record
      - name: Qualify installed app and packed MCP packages on Node 24.21.0
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm run build
          npm run typecheck:mcp
          npm run validate:mcp-release
          npm run smoke:mcp-artifacts
      - name: Retain exact runtime measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-node-runtime-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-node-runtime/
          if-no-files-found: error
          retention-days: 30

  persona-memory-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.persona_memory_profile
    name: diagnostic Persona memory profile (not release acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - run: npm ci --include=dev
      - name: Profile the unchanged full runtime workload
        env:
          PERSONA_SOAK_FULL: '1'
          PERSONA_SOAK_DAYS: '28'
          PERSONA_SOAK_ACTIVITIES_PER_DAY: '20'
          PERSONA_SOAK_SEED: '459'
          PERSONA_SOAK_WITH_LEARNING: '1'
          PERSONA_SOAK_MODE: infrastructure
          PERSONA_SOAK_COMMIT: ${{ github.sha }}
          PERSONA_SOAK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-profile
          PERSONA_SOAK_DEBUG: '1'
          PERSONA_SOAK_PROFILE_ALLOCATIONS: '1'
          PERSONA_SOAK_OUTPUT: profile-artifacts/soak
        run: |
          mkdir -p profile-artifacts
          node node_modules/jest/bin/jest.js \
            --selectProjects node --runInBand \
            __tests__/enduringAgents/runtimeClock.test.ts \
            __tests__/enduringAgents/soak/evidence.test.ts \
            __tests__/enduringAgents/soak/personaSoak.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: persona-memory-profile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: profile-artifacts/
          if-no-files-found: error
          retention-days: 30

  release-safety:
    name: Release safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      # Workflow structure checks use the lockfile-pinned YAML dependency.
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - run: npm ci --include=dev
      # Tests intercept every release subprocess before execution.
      - run: node --test scripts/verification-contract.test.mjs scripts/workflow-contract.test.mjs scripts/verify-repository-rules.test.mjs scripts/release-arguments.test.mjs scripts/release-verification.test.mjs scripts/require-release-verification.test.mjs scripts/npm-release.test.mjs scripts/release-github.test.mjs
      - run: node --test tests/installer-repository.test.mjs
      - run: node --test scripts/run-local-jest.test.mjs
      - run: node --test scripts/release-evidence.test.mjs
      - name: Verify maintainer evidence boundaries
        run: node --test scripts/read-bounded-file.test.mjs scripts/maintainer-drill.test.mjs scripts/maintainer-installed-baseline.test.mjs scripts/maintainer-installed-recovery.test.mjs scripts/maintainer-installed-upgrade.test.mjs scripts/maintainer-npm-provenance.test.mjs scripts/maintainer-synthetic-state.test.mjs
      - name: Exercise disposable ownership prototype
        timeout-minutes: 3
        run: node scripts/ownership-prototype/run.cjs "${{ runner.temp }}/ownership-prototype.json"
      - name: Retain ownership prototype fixture report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ownership-prototype-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ownership-prototype.json
          if-no-files-found: error
          retention-days: 30
      - run: npm run test:dependency-glob
      - name: Verify native private storage before building release artifacts
        run: node --test scripts/local-instance.test.mjs
      - run: node --test scripts/image-release.test.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - run: npm ci --include=dev
      # tsconfig.json includes __tests__/, so this also type-checks the suite.
      # It stops after the first fatal syntax error, which is why the Jest run
      # below (and __tests__/meta/parseAllTestFiles.test.ts) is the
      # authoritative "everything parses" gate.
      - run: npm run typecheck
      - run: npm run typecheck:mcp
      - run: node scripts/generate-api-inventory.mjs --check

  workflow-contract:
    name: workflow-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - run: npm ci --include=dev
      - run: node --test scripts/verification-contract.test.mjs scripts/workflow-contract.test.mjs scripts/verify-repository-rules.test.mjs scripts/verify-ci-node.test.mjs scripts/node-runtime.test.mjs scripts/scanner-workflow-contract.test.mjs scripts/probe-filesystem-identity.test.mjs

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - run: npm ci --include=dev
      - name: Audit the installed lockfile dependencies, including build tools
        run: npm audit --include=dev --audit-level=high --json > dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 30

  # Administrator prerequisite: disable CodeQL default setup before this
  # advanced setup can upload results. See docs/engineering-verification.md.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
          upload: always
          skip-queries: 'false'
          wait-for-processing: 'true'

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - run: npm ci --include=dev
      # Covers src/, __tests__/ and scripts/ with warnings treated as errors.
      - name: Verify the locked Next lint adapter and real rule callers
        run: npm run test:dependency-glob
      - run: npm run lint:all

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - run: npm ci --include=dev
      # Workspace creation and migration exercise the shipped package payloads.
      # A clean checkout has no compiled dist until this explicit prerequisite.
      - name: Build the standalone MCP packages
        run: npm run build:mcp
      # Jest's own exit code is deliberately not the gate: the baseline script
      # below is, because it distinguishes "a quarantined flake failed" from
      # "a suite stopped executing". It still records the raw results.
      - name: Run the suite
        id: jest
        continue-on-error: true
        run: npm run test:ci
      - name: Verify the published test baseline
        run: npm run verify:test-baseline -- --stage=ci --results=jest-results.json
      - name: Run deterministic memory ranking experiment
        run: npm run test:memory-experiment -- --json=memory-experiment-results.json --commit=${{ github.sha }}
      - name: Upload memory experiment results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-experiment-results
          path: memory-experiment-results.json
          if-no-files-found: warn
      - name: Upload Jest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-results-ci
          path: jest-results.json
          if-no-files-found: warn

  test-isolated:
    name: test-isolated
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - run: npm ci --include=dev
      - name: Build the standalone MCP packages
        run: npm run build:mcp
      # The child-process suites run serially on their own runner so they never
      # compete with the main run's Jest workers for CPU.
      - name: Run the process-boundary suites
        id: jest
        continue-on-error: true
        env:
          # Hosted runners are slower than a developer laptop; the harness
          # honours this override instead of a hardcoded budget.
          FLUJO_PERSONA_CHILD_READY_TIMEOUT_MS: 120000
          # Preserve the exact reconciliation fields when the smoke gate fails.
          PERSONA_SOAK_OUTPUT: soak-smoke-artifacts
          PERSONA_SOAK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-isolated-smoke
        run: npm run test:isolated
      - name: Verify the published test baseline
        run: npm run verify:test-baseline -- --stage=isolated --results=jest-results-isolated.json
      - name: Upload Jest results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jest-results-isolated
          path: jest-results-isolated.json
          if-no-files-found: warn
      - name: Upload Persona smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: persona-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: soak-smoke-artifacts/
          if-no-files-found: warn

  verification:
    name: verification
    if: always()
    needs: [production-build, release-safety, typecheck, lint, test, test-isolated, workflow-contract, dependency-security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - name: Refuse missing, skipped, cancelled or failed prerequisites
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: >-
          node --input-type=module -e
          "import { assertDependencyResults } from './scripts/verification-contract.mjs';
          assertDependencyResults(JSON.parse(process.env.VERIFICATION_NEEDS));"
