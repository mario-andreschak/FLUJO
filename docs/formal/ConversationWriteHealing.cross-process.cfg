\* expect: ok
\* Two FLUJO processes share one conversation: intent files, crashes, restarts, a capture and every fault kind.
CONSTANTS
  Proc = {p1, p2}
  Conv = {c1}
  Slots = 1
  MaxFaults = 1
  MaxCrashes = 1
  MaxCaptures = 1
  Legacy = {}
  NoOwner = NoOwner

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  SlotsBounded
  OneWriterPerConversation
  WriteHoldsIntent
  CaptureExcludesWrites
  QuarantineOnlyWhileOwned

PROPERTIES
  SavesFinish
  IntentNeverBlocks
  FencesHeal
  QuarantinesHeal
  LeasesRetire
  AbandonedLocksCleared
  CapturesFinish
