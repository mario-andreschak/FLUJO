name: Scorecard source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-source-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scorecard-source:
    name: Scorecard source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The publication checker reads the fixed planning baseline's Git objects.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run dedicated Docs checks and retain direct Node results
        run: node scripts/check-scorecard-ci.mjs "${{ runner.temp }}/scorecard-source-checks"
      - name: Retain scoped source report and raw output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-source-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scorecard-source-checks/
          if-no-files-found: error
          retention-days: 30
