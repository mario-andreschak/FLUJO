\* expect: violation
\* Before #1329: an intent left by a crash or an unknown outcome refused every later write to that chat.
CONSTANTS
  Proc = {p1}
  Conv = {c1}
  Slots = 1
  MaxFaults = 1
  MaxCrashes = 1
  MaxCaptures = 0
  Legacy = {"intentNeverReclaimed"}
  NoOwner = NoOwner

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  SlotsBounded
  OneWriterPerConversation
  WriteHoldsIntent
  CaptureExcludesWrites
  QuarantineOnlyWhileOwned

PROPERTIES
  SavesFinish
