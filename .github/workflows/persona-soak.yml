name: persona-soak

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Deterministic seed
        default: '459'
        required: true

concurrency:
  group: persona-soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-backed-acceptance:
    name: runtime-backed-28x20-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Run authoritative Persona soak
        env:
          SOAK_SEED: ${{ inputs.seed || '459' }}
          FLUJO_SOAK_COMMIT: ${{ github.sha }}
          FLUJO_SOAK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PERSONA_SOAK_DEBUG: '1'
        run: >-
          npm run soak:personas --
          --seed="$SOAK_SEED"
          --commit="$GITHUB_SHA"
          --run-id="$FLUJO_SOAK_RUN_ID"
      - name: Validate exact-commit evidence
        if: always()
        env:
          FLUJO_SOAK_COMMIT: ${{ github.sha }}
        run: >-
          node scripts/validate-persona-soak-artifacts.mjs
          --directory soak-artifacts
          --commit "$GITHUB_SHA"
          --mode acceptance
      - name: Generate artifact checksums
        if: always()
        run: |
          if test -f soak-artifacts/persona-soak.json && \
             test -f soak-artifacts/persona-soak.jsonl && \
             test -f soak-artifacts/persona-soak.md; then
            (cd soak-artifacts && sha256sum \
              persona-soak.json persona-soak.jsonl persona-soak.md > SHA256SUMS)
          fi
      - name: Publish report to job summary
        if: always()
        run: |
          if test -f soak-artifacts/persona-soak.md; then
            cat soak-artifacts/persona-soak.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-soak-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: soak-artifacts/
          if-no-files-found: error
          retention-days: 30
