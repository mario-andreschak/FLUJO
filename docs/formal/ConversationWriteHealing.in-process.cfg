\* expect: ok
\* One process, two conversations: writer slots, the shared writer registration, quarantine and a capture.
CONSTANTS
  Proc = {p1}
  Conv = {c1, c2}
  Slots = 1
  MaxFaults = 2
  MaxCrashes = 1
  MaxCaptures = 1
  Legacy = {}
  NoOwner = NoOwner

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
  TypeOK
  SlotsBounded
  OneWriterPerConversation
  WriteHoldsIntent
  CaptureExcludesWrites
  QuarantineOnlyWhileOwned

PROPERTIES
  SavesFinish
  IntentNeverBlocks
  FencesHeal
  QuarantinesHeal
  LeasesRetire
  AbandonedLocksCleared
  CapturesFinish
