name: Scorecard source checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-source-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  scorecard-source:
    name: Scorecard source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The publication checker reads the fixed planning baseline's Git objects.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.3 --record
      - name: Run dedicated Docs checks and retain direct Node results
        run: node scripts/check-scorecard-ci.mjs "${{ runner.temp }}/scorecard-source-checks"
      - name: Retain scoped source report and raw output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-source-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scorecard-source-checks/
          if-no-files-found: error
          retention-days: 30
      - name: Retain official Node binary measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-node-runtime-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-node-runtime/
          if-no-files-found: error
          retention-days: 30
