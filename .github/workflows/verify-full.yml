# Pull-request verification (issue #457).
#
# Before this workflow existed no CI job ran `npm test`, `tsc --noEmit` or
# `eslint` on a pull request: two test files that could not even be parsed were
# merged to main and stayed broken. These jobs are the gate that makes a
# non-executing test file impossible to miss.
#
# Required contexts and administrator acceptance are documented in
# docs/engineering-verification.md. YAML alone does not protect main.
name: verify-full

on:
  workflow_dispatch:
    inputs:
      persona_memory_profile:
        description: Also capture a diagnostic allocation profile of the full Persona soak
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-build:
    name: Production build (${{ matrix.os }})
    # Keep required check labels stable while holding Linux on the qualified OS.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Build once on a supported runtime, then qualify the same artifacts below.
          node-version: '24.22.1'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 24.22.1 --record
      - name: Determine whether application qualification inputs changed
        id: application-change
        shell: bash
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          let changed = true;
          if (process.env.GITHUB_EVENT_NAME === 'pull_request') {
            const { BASE_REVISION: base, HEAD_REVISION: head } = process.env;
            if (![base, head].every(value => /^[a-f0-9]{40}$/.test(value ?? ''))) throw new Error('Invalid comparison revision');
            const files = execFileSync('git', ['diff', '--name-only', '-z', base, head], { encoding: 'utf8' }).split('\0').filter(Boolean);
            const ciOnly = file => file.startsWith('.github/workflows/') || ['scripts/workflow-contract.mjs', 'scripts/workflow-contract.test.mjs'].includes(file);
            changed = files.length === 0 || files.some(file => !ciOnly(file));
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + changed + '\n');
          console.log(changed ? 'Application inputs changed: run full production qualification.' : 'Only workflow files changed: reuse the base application qualification and validate workflow shell syntax.');
          NODE
      - run: npm ci --include=dev
      - name: Validate Worker publisher shell syntax
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import YAML from 'yaml';
          const workflow = YAML.parse(fs.readFileSync('.github/workflows/publish-cloud-worker.yml', 'utf8'));
          let count = 0;
          for (const step of workflow.jobs.publish.steps) {
            if (step.shell !== 'bash' || typeof step.run !== 'string') continue;
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'worker-publish-syntax-' + count++ + '.sh'), step.run);
          }
          if (count < 2) throw new Error('Expected validation and publication shell scripts');
          NODE
          for publish_script in "$RUNNER_TEMP"/worker-publish-syntax-*.sh; do
            bash -n "$publish_script"
          done
      - name: Verify the packaged Antigravity CLI on this operating system
        if: steps.application-change.outputs.changed == 'true'
        run: node --test scripts/antigravity-cli-artifact.test.mjs
      - name: Verify tracing against a populated runtime directory
        if: steps.application-change.outputs.changed == 'true'
        run: node --test scripts/exclude-workspaces-from-next-glob.test.mjs
      - name: Build with the ordinary command and default Node heap
        if: steps.application-change.outputs.changed == 'true'
        run: npm run build
      - name: Validate built MCP package types and release inventory
        if: steps.application-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:mcp
          npm run validate:mcp-release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.application-change.outputs.changed == 'true'
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        if: steps.application-change.outputs.changed == 'true'
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      # Installs the packed app into a fresh profile, starts it, connects the
      # bundled MCP servers and lists resources repeatedly. On windows-latest
      # it also lists while real file locks (as antivirus takes them) hold the
      # owner, approval and server-config files, and fails on any refusal (#1050).
      - name: Qualify installed app, packed MCP packages and resource listing on Node 22.23.4
        if: steps.application-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:mcp-artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.application-change.outputs.changed == 'true'
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Verify exact official Node runtime
        if: steps.application-change.outputs.changed == 'true'
        run: node scripts/verify-ci-node.mjs 24.22.1 --record
      - name: Qualify installed app, packed MCP packages and resource listing on Node 24.22.1
        if: steps.application-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run smoke:mcp-artifacts
      # Same checks as the release image and installer jobs (#570). The data
      # folder sits on a small tmpfs (Linux) or virtual disk (Windows) that the
      # disk-full check fills; both need the runner's sudo or administrator rights.
      - name: Back up, restart, upgrade, fill the disk and restore the installed npm package
        if: steps.application-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/packaged-acceptance.mjs --form npm --pack --from npm:latest --report "$RUNNER_TEMP/packaged-acceptance/npm.json"
      - name: Follow the operator runbook with the packed release
        if: steps.application-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/operator-runbook.mjs --pack --report "$RUNNER_TEMP/packaged-acceptance/operator-runbook.json"
      - name: Retain the packaged acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packaged-acceptance-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packaged-acceptance/
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain exact runtime measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-node-runtime-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-node-runtime/
          if-no-files-found: error
          retention-days: 30
      - name: Verify the packed Antigravity production consumer
        if: steps.application-change.outputs.changed == 'true'
        run: node --test scripts/antigravity-cli-consumer.test.mjs

  persona-memory-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.persona_memory_profile
    name: diagnostic Persona memory profile (not release acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - name: Profile the unchanged full runtime workload
        env:
          PERSONA_SOAK_FULL: '1'
          PERSONA_SOAK_DAYS: '28'
          PERSONA_SOAK_ACTIVITIES_PER_DAY: '20'
          PERSONA_SOAK_SEED: '459'
          PERSONA_SOAK_WITH_LEARNING: '1'
          PERSONA_SOAK_MODE: infrastructure
          PERSONA_SOAK_COMMIT: ${{ github.sha }}
          PERSONA_SOAK_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-profile
          PERSONA_SOAK_DEBUG: '1'
          PERSONA_SOAK_PROFILE_ALLOCATIONS: '1'
          PERSONA_SOAK_OUTPUT: profile-artifacts/soak
        run: |
          mkdir -p profile-artifacts
          node node_modules/jest/bin/jest.js \
            --selectProjects node --runInBand \
            __tests__/enduringAgents/runtimeClock.test.ts \
            __tests__/enduringAgents/soak/evidence.test.ts \
            __tests__/enduringAgents/soak/personaSoak.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: persona-memory-profile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: profile-artifacts/
          if-no-files-found: error
          retention-days: 30

  # The installed Windows build, exactly as people get it: the compiled
  # flujo-setup.exe installs this revision, then the packaged checks run on it (#570).
  installed-windows-acceptance:
    name: Installed Windows build acceptance (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - name: Install pinned Inno Setup
        shell: powershell
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey could not install Inno Setup 6.7.1 (exit $LASTEXITCODE)."
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Pinned Inno Setup compiler was not found: $iscc"
          }
      - name: Compile the installer for this revision
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=0.0.0" "/DMyBranch=$env:GITHUB_REF_NAME" "/DMyRevision=$env:GITHUB_SHA" installer\flujo-setup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed (exit $LASTEXITCODE)."
          }
      - name: Prepare real App Installer
        shell: pwsh
        run: ./scripts/prepare-windows-installer-runner.ps1
      - name: Install, rerun and launch the compiled installer
        shell: pwsh
        run: ./scripts/verify-windows-install.ps1
      - name: Back up, restart, upgrade, fill the disk and restore the installed application
        shell: pwsh
        run: |
          $runtime = Join-Path $env:LOCALAPPDATA 'FLUJO-cli\runtime\node-v24.22.1-win-x64\node.exe'
          $runtimeArguments = if (Test-Path -LiteralPath $runtime) { @('--node', $runtime) } else { @() }
          $appRoot = Join-Path $env:RUNNER_TEMP 'FLUJO fresh install'
          $report = Join-Path $env:RUNNER_TEMP 'flujo-install-evidence\packaged-acceptance.json'
          node scripts/packaged-acceptance.mjs --form checkout --app-root $appRoot --from npm:latest --report $report @runtimeArguments
          if ($LASTEXITCODE -ne 0) { throw "Installed acceptance failed (exit $LASTEXITCODE)." }
      - name: Retain installation evidence and the acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packaged-acceptance-installed-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flujo-install-evidence/**
          if-no-files-found: error
          retention-days: 30

  # The Docker image built from this revision, on a tmpfs volume that a holder
  # container keeps mounted; the previous published image writes the data (#570).
  image-acceptance:
    name: Docker image acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - name: Read the application version
        id: version
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${require("./package.json").version}\n`)'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image from this revision
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: flujo-acceptance:${{ github.sha }}
          build-args: |
            FLUJO_APPLICATION_VERSION=${{ steps.version.outputs.version }}
            FLUJO_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
      - name: Back up, restart, upgrade, fill the disk and restore the image
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' "flujo-acceptance:${GITHUB_SHA}")"
          node scripts/packaged-acceptance.mjs --form docker --image "$image_id" --from image:ghcr.io/mario-andreschak/flujo:latest --report "$RUNNER_TEMP/packaged-acceptance/docker.json"
      - name: Retain the acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packaged-acceptance-docker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packaged-acceptance/
          if-no-files-found: error
          retention-days: 30

  release-safety:
    name: Release safety (${{ matrix.os }})
    # Keep required check labels stable while holding Linux on the qualified OS.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
      # Workflow structure checks use the lockfile-pinned YAML dependency.
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - name: Preserve clean release checkout after dependency install
        run: >-
          node --input-type=module -e
          "import { execFileSync } from 'node:child_process';
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          if (process.platform === 'win32') {
            git(['diff', '--exit-code']);
            if (git(['ls-files', '--others', '--exclude-standard'])) process.exitCode = 1;
          } else if (git(['status', '--porcelain'])) process.exitCode = 1;"
      # Tests intercept every release subprocess before execution.
      - run: node --test scripts/verification-contract.test.mjs scripts/workflow-contract.test.mjs scripts/verify-repository-rules.test.mjs scripts/release-arguments.test.mjs scripts/release-verification.test.mjs scripts/require-release-verification.test.mjs scripts/npm-release.test.mjs scripts/release-github.test.mjs scripts/installer-release.test.mjs
      - run: node --test tests/installer-repository.test.mjs
      - name: Verify Windows installer decisions before publication
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path tests/installer.Tests.ps1 -CI
      - name: Verify isolated launcher bootstrap and child environment
        run: node --test scripts/bootstrap-directory.test.mjs scripts/bootstrap-launcher.test.mjs
      - run: node --test scripts/run-local-jest.test.mjs
      - run: node --test scripts/release-evidence.test.mjs
      - name: Verify maintainer evidence boundaries
        run: node --test scripts/read-bounded-file.test.mjs scripts/maintainer-drill.test.mjs scripts/maintainer-installed-baseline.test.mjs scripts/maintainer-installed-recovery.test.mjs scripts/maintainer-installed-upgrade.test.mjs scripts/maintainer-npm-provenance.test.mjs scripts/maintainer-synthetic-state.test.mjs
      - name: Verify the packaged-artifact checks and the automated operator run
        timeout-minutes: 15
        run: node --test scripts/packaged-acceptance.test.mjs scripts/packaged-acceptance/low-disk.test.mjs scripts/packaged-acceptance/stand-ins.test.mjs scripts/operator-runbook.test.mjs
      - name: Verify the shipped Codex with the local model stand-in
        timeout-minutes: 10
        run: node --test scripts/packaged-codex-acceptance.test.mjs
      - name: Exercise disposable ownership prototype
        timeout-minutes: 3
        run: node scripts/ownership-prototype/run.cjs "${{ runner.temp }}/ownership-prototype.json"
      - name: Retain ownership prototype fixture report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ownership-prototype-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ownership-prototype.json
          if-no-files-found: error
          retention-days: 30
      - run: npm run test:dependency-glob
      - name: Verify native private storage before building release artifacts
        run: node --test scripts/local-instance.test.mjs
      - run: node --test scripts/image-release.test.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      # tsconfig.json includes __tests__/, so this also type-checks the suite.
      # It stops after the first fatal syntax error, which is why the Jest run
      # below (and __tests__/meta/parseAllTestFiles.test.ts) is the
      # authoritative "everything parses" gate.
      - run: npm run typecheck
      - run: npm run typecheck:mcp
      - run: node scripts/generate-api-inventory.mjs --check
      - name: Verify packed Avatar SDK installation
        run: |
          npm run verify:avatar-sdk
          node --test scripts/avatar-sdk-packed-dependency.test.mjs

  workflow-contract:
    name: workflow-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Integrity fixtures are pinned to an immutable historical revision.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - run: node --test scripts/verification-contract.test.mjs scripts/workflow-contract.test.mjs scripts/required-check-workflow.test.mjs scripts/verify-repository-rules.test.mjs scripts/verify-ci-node.test.mjs scripts/node-runtime.test.mjs scripts/scanner-workflow-contract.test.mjs scripts/probe-filesystem-identity.test.mjs scripts/required-check-workflow.test.mjs scripts/next-lint-glob.test.mjs scripts/selector-parser-security.test.mjs scripts/qualify-conversation-recovery.test.mjs scripts/security-response-check.test.mjs

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - name: Audit the installed lockfile dependencies, including build tools
        run: npm audit --include=dev --audit-level=high --json > dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependency-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 30

  # Genuine two-language extended scans and processed result uploads.
  # If default setup is enabled, an administrator must switch it to advanced.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
          upload: always
          skip-queries: 'false'
          wait-for-processing: 'true'

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The lint ratchet compares eslint-suppressions.json with the first parent.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      # Covers src/, __tests__/ and scripts/ with warnings treated as errors.
      - name: Verify the locked Next lint adapter and real rule callers
        run: npm run test:dependency-glob
      - name: Verify FLUJO's own lint rules, repository checks and app driver
        run: npm run test:checks
      - run: npm run lint:all
      - run: npm run lint:ratchet
      - name: Keep the biggest execution and MCP files shrinking, with no imports back into them
        run: npm run check:hotspots && npm run check:boundaries
      - run: npm run check:repo-hygiene
      - run: npm run check:feature-map
      # Model-checks docs/formal with the pinned official TLA+ tools; the runner image has Java 17.
      - name: Check that conversation saves always heal (TLA+ model)
        run: npm run check:formal

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      # Workspace creation and migration exercise the shipped package payloads.
      # A clean checkout has no compiled dist until this explicit prerequisite.
      - name: Build the standalone MCP packages
        run: npm run build:mcp
      - name: Prepare real Linux MCP isolation image
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker_path="$(command -v docker)"
          daemon='unix:///var/run/docker.sock'
          test "$("$docker_path" --host "$daemon" info --format '{{.OSType}}/{{.CgroupVersion}}')" = 'linux/2'
          # Both registries must provide the same pinned upstream manifest.
          digest='sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392'
          image_ref=''
          for registry in node:22.23.4-bookworm-slim public.ecr.aws/docker/library/node:22.23.4-bookworm-slim; do
            for attempt in 1 2; do
              if "$docker_path" --host "$daemon" pull "$registry@$digest"; then
                image_ref="$registry@$digest"
                break 2
              fi
              sleep "$attempt"
            done
          done
          test -n "$image_ref"
          image="$("$docker_path" --host "$daemon" image inspect "$image_ref" --format '{{.Id}}')"
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "FLUJO_TEST_ISOLATION_DOCKER=$docker_path" "FLUJO_TEST_ISOLATION_DAEMON=$daemon" "FLUJO_TEST_ISOLATION_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Exercise real Linux MCP discovery and cleanup before the full suite
        env:
          FLUJO_RUN_ISOLATION_SOURCE_PROBE: '1'
        run: node scripts/run-local-jest.cjs --ci --selectProjects node --runInBand __tests__/mcp/isolatedMcpContainerSource.test.ts
      # The shipped image, built from this checkout, starts on 1 CPU and 2 GB, passes its health
      # check and answers a first chat and the voice check against local stand-ins (#1408).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: flujo-container-smoke:${{ github.sha }}
          cache-from: type=gha,scope=container-smoke
          # Pull requests reuse what main stored; only main writes the cache.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=container-smoke,mode=max' || '' }}
      - name: Check the container image's health, first chat and voice settings
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-container-image.mjs --image "flujo-container-smoke:${GITHUB_SHA}" --report "$RUNNER_TEMP/container-smoke/report.json"
      - name: Keep the container smoke report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-smoke/
          if-no-files-found: ignore
          retention-days: 30
      - name: Critical backend regressions
        run: node scripts/run-local-jest.cjs --ci --selectProjects node --runInBand --runTestsByPath __tests__/settings/backupRestoreRoutes.test.ts __tests__/settings/backupStrictStorage.test.ts __tests__/workspace/workspaceListRoute.test.ts __tests__/workspace/workspaceCreateMcpRecords.test.ts __tests__/workspace/workspaceRouteWrapper.test.ts __tests__/flow/conversationLogReadAdmission.test.ts __tests__/flow/conversationSnapshotAdmission.test.ts __tests__/flow/modelTurnArchiveWriteBudget.test.ts __tests__/mcp/toolDiscoveryPagination.test.ts __tests__/mcp/storedTransportAdmission.test.ts __tests__/mcp/tasksGenerationsProtocol.test.ts __tests__/mcp/clientTasksLifecycle.test.ts __tests__/mcp/tasksExtensionSession.test.ts __tests__/mcp/serverTasks.test.ts __tests__/mcp/flowsTasksServer.test.ts __tests__/mcp/flowsTasksRouteClassification.test.ts __tests__/mcp/protectedPackageRunner.test.ts __tests__/model/openaiCompatibleProvider.test.ts __tests__/ollama/ollamaClient.test.ts __tests__/ollama/pullRoute.test.ts __tests__/packages/workspaceMcpPreparationMarker.test.ts __tests__/security/ownerAccess.test.ts __tests__/security/isolatedMcp.test.ts __tests__/mcp/isolatedMcpTransport.test.ts __tests__/mcp/securityReviewSource.test.ts __tests__/mcp/securityReviewReport.test.ts __tests__/mcp/securityReviewRoute.test.ts __tests__/mcp/securityReviewLifecycle.test.ts __tests__/mcp/securityReviewRunner.test.ts __tests__/mcp/modelRiskEvidence.test.ts __tests__/mcp/modelRiskAssessment.test.ts __tests__/mcp/modelRiskAssessmentRoute.test.ts __tests__/model/readOnlyAssessmentAdapter.test.ts __tests__/mcp/discoverySearch.test.ts __tests__/mcp/registryDiscovery.test.ts __tests__/mcp/assistedPreferences.test.ts __tests__/mcp/assistedRanking.test.ts __tests__/mcp/assistedInstall.test.ts __tests__/mcp/assistantRoute.test.ts __tests__/mcp/registryInstall.test.ts __tests__/mcp/registryIconsRoute.test.ts __tests__/mcp/registryDiscoveryClient.test.ts __tests__/mcp/registryDiscoveryRoute.test.ts __tests__/mcp/registryWorkspaceIsolation.test.ts __tests__/mcp/quality/orchestrator.test.ts __tests__/mcp/installBestAssistedTool.test.ts __tests__/mcp/assistedDiscoveryBody.test.ts
      - name: Critical frontend regressions
        run: node scripts/run-local-jest.cjs --ci --selectProjects jsdom --runInBand --runTestsByPath __tests__/frontend/components/DayViewMiniMonth.test.tsx __tests__/frontend/components/ChatHistory.test.tsx __tests__/frontend/components/PersonaGoalCard.test.tsx __tests__/frontend/components/PersonaGoalValidation.test.tsx __tests__/frontend/components/BackupSettings.test.tsx __tests__/frontend/components/ModelConnectionWizard.test.tsx __tests__/frontend/components/McpConnectionWizard.test.tsx __tests__/frontend/components/McpAiConnectionPanel.test.tsx __tests__/frontend/components/McpServerManagerWizardOwnership.test.tsx __tests__/frontend/components/oauthPopup.test.ts __tests__/frontend/components/CardPickerGrid.test.tsx __tests__/frontend/components/PersonaCreationWizard.test.tsx __tests__/frontend/components/RoleVersionCardLocalization.test.tsx __tests__/frontend/components/McpSecurityReviewPanel.test.tsx __tests__/frontend/components/McpModelRiskAssessmentPanel.test.tsx __tests__/frontend/components/ServerModalDiscoverySession.test.tsx __tests__/frontend/components/MarketplaceTab.test.tsx
      # Jest's own exit code is deliberately not the gate: the baseline script
      # below is, because it distinguishes "a quarantined flake failed" from
      # "a suite stopped executing". It still records the raw results.
      - name: Run the suite
        id: jest
        continue-on-error: true
        env:
          FLUJO_RUN_ISOLATION_SOURCE_PROBE: '1'
        run: npm run test:ci
      - name: Verify the published test baseline
        run: npm run verify:test-baseline -- --stage=ci --results=jest-results.json
      - name: Upload Jest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jest-results-ci
          path: jest-results.json
          if-no-files-found: warn

  test-isolated:
    name: test-isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - name: Build the standalone MCP packages
        run: npm run build:mcp
      # The child-process suites run serially on their own runner so they never
      # compete with the main run's Jest workers for CPU.
      - name: Run the process-boundary suites
        id: jest
        continue-on-error: true
        run: npm run test:isolated
      - name: Verify the published test baseline
        run: npm run verify:test-baseline -- --stage=isolated --results=jest-results-isolated.json
      - name: Upload Jest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jest-results-isolated
          path: jest-results-isolated.json
          if-no-files-found: warn

  # The official Antigravity CLI against a local stand-in model on the desktop
  # systems the main test job does not run (it covers Linux): tool isolation,
  # multi-turn continuity across a restart, and effort levels from `agy models`.
  antigravity-cli:
    name: Antigravity CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - name: Install the official Antigravity CLI the way FLUJO does
        run: node -e "require('./bin/antigravity-runtime.cjs').resolveBinary().then(binary => console.log(binary))"
      - name: Run the official Antigravity CLI against the local stand-in model
        run: node scripts/run-local-jest.cjs --ci --selectProjects node --runInBand --runTestsByPath __tests__/model/antigravityCliIntegration.test.ts

  # The Claude Code bundled with the Agent SDK for each desktop system, run by
  # FLUJO's Claude adapter and flow engine against a local stand-in of
  # Anthropic's service (#1092, #1096, #756): approvals, resumed sessions,
  # instructions per turn, compaction, steering, usage, the subscription numbers
  # and that no Claude Code process outlives its turn. Linux runs the same
  # suites in test-isolated. No account or key is needed.
  claude-code:
    name: Claude Code (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - name: Run the bundled Claude Code against the local stand-in of Anthropic's service
        run: node scripts/run-local-jest.cjs --ci --selectProjects node --runInBand --runTestsByPath __tests__/model/claudeCodeStandIn.test.ts __tests__/chat/claudeFlowStandIn.test.ts

  # FLUJO's system key (#1443) against the real key store of each desktop
  # system: Windows data protection and the macOS login Keychain. Store and
  # read back, restart, replace the data key, move an existing install, recover
  # a lost key, re-protect a restored workspace. No person has to try it.
  system-key-store:
    name: System key store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - name: Build the standalone MCP packages
        run: npm run build:mcp
      - name: Prove the system key against the real key store
        run: node scripts/check-system-key-store.mjs

  # The same on Linux, headless: a throwaway GNOME keyring under its own D-Bus
  # session, then that keyring locked, then a session without a keyring service
  # and no session at all (Docker, servers), where FLUJO keeps basic protection.
  system-key-store-linux:
    name: System key store (Linux keyring)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - name: Install the GNOME keyring, secret-tool and D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-tools dbus
      - run: npm ci --include=dev
      - name: Build the standalone MCP packages
        run: npm run build:mcp
      - name: Prove the system key against the real keyring and its fallbacks
        run: node scripts/check-system-key-store.mjs

  # Follows docs/contributing/README.md word for word on Linux and macOS: a
  # fresh clone of this commit, the install, the first checks, the throwaway
  # app (it must answer, then stop on Ctrl+C) and the checks before a pull
  # request, including the type check. The commands come from the guide
  # itself, so the guide cannot drift from what works (#1441).
  contributor-guide:
    name: Contributor guide (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The guide clones the full history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - name: Follow the contributor guide in a fresh clone
        run: node scripts/contributor-guide.mjs --report "${{ runner.temp }}/contributor-guide"
      - name: Keep the walkthrough report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contributor-guide-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contributor-guide/
          if-no-files-found: error
          retention-days: 30

  # The path a newcomer takes (#572), on a fresh production build with a free
  # stand-in AI: connect and test an AI, test an app's tool, build an agent in
  # the simple builder, run it with a tool approval, read its steps, then reuse
  # it through the OpenAI-compatible API and the app through the MCP proxy.
  # Desktop and phone screens; fails on any stage, page crash or a path slower
  # than 15 minutes. Tool approvals get their own walk on the same build.
  # Screenshots and report.json are kept either way.
  first-use-journey:
    name: First-use journey
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - name: Install the journey's browser
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Walk the first-use journey on a desktop screen
        env:
          FLUJO_DRIVE_HOME: ${{ runner.temp }}/flujo-drive
        run: npm run journey:first-use
      - name: Walk the first-use journey on a phone screen
        env:
          FLUJO_DRIVE_HOME: ${{ runner.temp }}/flujo-drive
        run: npm run journey:first-use -- --viewport 390x844
      # The tool result size limit (#1226) the way a person uses it, on the same
      # build with a local stand-in AI: set it in Settings (a bad size is
      # refused), see a big tool result moved behind a flujo://run/ link, then
      # give the agent's AI step "Keep results in full" and see the whole result.
      - name: Check the tool result size limit in the browser
        env:
          FLUJO_DRIVE_HOME: ${{ runner.temp }}/flujo-drive
        run: npm run check:tool-result-limit
      # "Require tool approvals" (#1284) the way a person uses it, on the same
      # build with local stand-ins for an OpenAI-style model and for Anthropic:
      # off and on, mixed decisions, per-conversation boxes, reload, Stop, a
      # failed save, a sub-flow's live wait in the chat and in the approval
      # inbox, keyboard use, a Claude subscription model and a paused automation.
      - name: Check tool approvals in the browser
        env:
          FLUJO_DRIVE_HOME: ${{ runner.temp }}/flujo-drive
        run: npm run journey:tool-approval
      # In-chat app views through a signed-in front door (#1336): the same build
      # in Localhost mode with the documented front door settings, behind a local
      # HTTPS gateway that needs a sign-in cookie. A browser signs in, opens a chat
      # and must see the app view render from the gateway's sandbox address.
      - name: Show an app view in a chat through a signed-in front door
        env:
          FLUJO_DRIVE_HOME: ${{ runner.temp }}/flujo-drive
        run: npm run journey:front-door
      # Connect a 128-tool app over Streamable HTTP and SSE through the screens,
      # reach its last tool by keyboard and test it with a filled-in form.
      - name: Reach every tool of a 128-tool app on the same build
        env:
          FEATURE_BROWSER_APP_DIR: ${{ github.workspace }}
        run: npx playwright test --config=playwright.features-first-use.config.mjs
      # The tool tester on that build: all 128 tools by keyboard, a run with its
      # embedded app, unfinished form input kept through slow and failed
      # refreshes with the "earlier list" warning, and seven languages.
      - name: Test the tool tester on the same build
        env:
          FEATURE_BROWSER_APP_DIR: ${{ github.workspace }}
        run: npx playwright test --config=playwright.features.config.mjs
      - name: Keep the journey's screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: first-use-journey-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flujo-drive/evidence/first-journey/
            ${{ runner.temp }}/flujo-drive/evidence/front-door/
            ${{ runner.temp }}/flujo-drive/evidence/tool-result-limit/
            ${{ runner.temp }}/flujo-drive/evidence/tool-approval-journey/
            test-results/features-first-use/
            feature-first-use-artifacts/
            test-results/features/
            feature-browser-artifacts/
          if-no-files-found: error
          retention-days: 30

  # The pilot (#577) without people: scripted first-time users, each on a fresh
  # production build with an empty data folder and a local stand-in model, work
  # through the tester guide's day-one tasks. Each task must show its result in
  # time without an error message; any failed task fails the run.
  scripted-pilot:
    name: Scripted pilot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Play first-time users through the pilot tasks
        shell: bash
        run: npm run pilot:scripted -- --mode start --out "$RUNNER_TEMP/scripted-pilot"
      - name: Show the pilot result on the run page
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/scripted-pilot/result.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Retain the pilot result, diagnostic reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scripted-pilot-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scripted-pilot/
          if-no-files-found: error
          retention-days: 30

  # Issue #757 without a person: 300 parallel chat requests against a fresh
  # production build and a local stand-in model, streamed and plain, and once
  # more while FLUJO is still starting. Every request must be answered
  # correctly, none refused, and FLUJO must reach the model in time
  # (PASS_RULES in scripts/chat-burst-load-test.mjs); otherwise the step fails.
  chat-burst-load:
    name: Chat burst load test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - run: npm ci --include=dev
      - run: npm run build
      - name: 300 parallel streamed chats
        shell: bash
        run: node scripts/chat-burst-load-test.mjs --parallel 300 --mode stream --out "$RUNNER_TEMP/chat-burst/stream-300.json"
      - name: 300 parallel plain chats
        shell: bash
        run: node scripts/chat-burst-load-test.mjs --parallel 300 --mode json --out "$RUNNER_TEMP/chat-burst/json-300.json"
      - name: 50 parallel plain chats
        shell: bash
        run: node scripts/chat-burst-load-test.mjs --parallel 50 --mode json --out "$RUNNER_TEMP/chat-burst/json-50.json"
      - name: 300 parallel chats while FLUJO is starting
        shell: bash
        run: node scripts/chat-burst-load-test.mjs --parallel 300 --mode stream --cold-start --out "$RUNNER_TEMP/chat-burst/cold-start-300.json"
      - name: Keep the load test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chat-burst-load-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chat-burst/
          if-no-files-found: error
          retention-days: 30

  verification:
    name: verification
    if: always()
    needs: [production-build, release-safety, typecheck, lint, test, test-isolated, workflow-contract, dependency-security, codeql, antigravity-cli, installed-windows-acceptance, image-acceptance, system-key-store, system-key-store-linux, contributor-guide, first-use-journey, scripted-pilot, claude-code, chat-burst-load]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
      - name: Verify exact official Node runtime
        run: node scripts/verify-ci-node.mjs 22.23.4 --record
      - name: Refuse missing, skipped, cancelled or failed prerequisites
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: >-
          node --input-type=module -e
          "import { assertFullDependencyResults } from './scripts/verification-contract.mjs';
          assertFullDependencyResults(JSON.parse(process.env.VERIFICATION_NEEDS));"
